# ============================================================
# Spring / Database
# ============================================================
# Defaults below are for local MySQL development.
# On Render, the datasource is injected via environment variables
# (SPRING_DATASOURCE_USERNAME/PASSWORD and DB_HOST/DB_PORT/DB_NAME, which
# entrypoint.sh composes into a jdbc:postgresql:// URL).
spring.datasource.url=jdbc:mysql://localhost:3306/resolveit
spring.datasource.username=root
spring.datasource.password=YOUR_SQL_PASSWORD
# Driver class is auto-detected from the JDBC URL scheme (works for both
# MySQL and PostgreSQL), so it is intentionally NOT set here.

# Hibernate creates/updates the schema on startup (works for MySQL and PostgreSQL).
# The dialect is auto-detected from the JDBC connection.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Server
# ============================================================
server.port=8080
# Trust X-Forwarded-* headers from Render's proxy so generated URLs
# (e.g. attachment view/download links) use the public https URL.
server.forward-headers-strategy=framework

# ============================================================
# JWT
# ============================================================
# Override jwt.secret via the JWT_SECRET env var in production.
jwt.secret=myResolveITSecretKey123456789!
jwt.expiration-ms=3600000

# ============================================================
# File upload
# ============================================================
# NOTE: On Render the filesystem is ephemeral - uploaded files are lost on
# redeploy. Fine for a demo; use Render Disk or object storage for persistence.
file.upload-dir=uploads

# ============================================================
# CORS
# ============================================================
# Comma-separated list of allowed frontend origins.
# Set APP_CORS_ALLOWED_ORIGINS on Render to your Vercel URL.
app.cors.allowed-origins=http://localhost:3000

# ============================================================
# Email (Gmail SMTP)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL_ID
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Application-specific email settings
app.mail.from=YOUR_EMAIL_ID
app.mail.from-name=ResolveIt Support
app.frontend.url=http://localhost:3000

# ============================================================
# Bootstrap admin (optional)
# ============================================================
# If both are non-empty AND no ROLE_ADMIN user exists, a default admin is
# created on startup. Set APP_BOOTSTRAP_ADMIN_EMAIL / APP_BOOTSTRAP_ADMIN_PASSWORD
# as Render env vars (do NOT commit real values here).
app.bootstrap.admin-email=
app.bootstrap.admin-password=
